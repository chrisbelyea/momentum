# Liquibase Configuration for Momentum
# This file defines default properties for database migrations

# Changelog file location (relative to repository root when using --defaultsFile)
changeLogFile=liquibase/changelog.xml

# Database connection (example for SQLite - default for self-hosted)
# In production, override these via environment variables or command-line arguments
driver=org.sqlite.JDBC
url=jdbc:sqlite:momentum.db

# For PostgreSQL (optional production deployment):
# driver=org.postgresql.Driver
# url=jdbc:postgresql://localhost:5432/momentum
# username=momentum_user
# password=

# Validation settings
# Strict validation ensures changesets cannot be modified after deployment
liquibase.strictChecksums=true
