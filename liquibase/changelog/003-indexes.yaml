databaseChangeLog:
  - changeSet:
      id: 002-indexes
      author: copilot
      changes:
        - createIndex:
            indexName: idx_backends_user_id
            tableName: backends
            columns:
              - column: { name: user_id }
        - createIndex:
            indexName: idx_tasks_backend_status
            tableName: tasks
            columns:
              - column: { name: backend_id }
              - column: { name: status }
        - createIndex:
            indexName: idx_tasks_due_at
            tableName: tasks
            columns:
              - column: { name: due_at }
        - createIndex:
            indexName: idx_credentials_user_id
            tableName: credentials
            columns:
              - column: { name: user_id }
        - createIndex:
            indexName: idx_sessions_user_id
            tableName: sessions
            columns:
              - column: { name: user_id }
        - createIndex:
            indexName: idx_sessions_expires_at
            tableName: sessions
            columns:
              - column: { name: expires_at }
      rollback:
        - dropIndex:
            indexName: idx_backends_user_id
            tableName: backends
        - dropIndex:
            indexName: idx_tasks_backend_status
            tableName: tasks
        - dropIndex:
            indexName: idx_tasks_due_at
            tableName: tasks
        - dropIndex:
            indexName: idx_credentials_user_id
            tableName: credentials
        - dropIndex:
            indexName: idx_sessions_user_id
            tableName: sessions
        - dropIndex:
            indexName: idx_sessions_expires_at
            tableName: sessions
