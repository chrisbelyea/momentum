databaseChangeLog:
  - changeSet:
      id: 003-auth
      author: copilot
      changes:
        - createTable:
            tableName: credentials
            columns:
              - column: { name: user_id, type: INTEGER, constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_credentials, foreignKeyName: fk_credentials_user, references: users(id), deleteCascade: true } }
              - column: { name: type, type: VARCHAR(64), constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_credentials } }
              - column: { name: secret_hash, type: VARCHAR(255) }
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }
        - createTable:
            tableName: sessions
            columns:
              - column: { name: id, type: VARCHAR(128), constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: INTEGER, constraints: { nullable: false, foreignKeyName: fk_sessions_user, references: users(id), deleteCascade: true } }
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: expires_at, type: TIMESTAMP, constraints: { nullable: false } }
      rollback:
        - dropTable:
            tableName: sessions
        - dropTable:
            tableName: credentials
