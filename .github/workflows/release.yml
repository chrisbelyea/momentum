name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  goreleaser:
    name: Build release artifacts (draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verify canonical embedded schema
        run: scripts/db/generate-init-sql.sh --check
      - name: Build draft release
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" -w /workspace \
            -e GITHUB_TOKEN ghcr.io/goreleaser/goreleaser-cross:v1.25.8 release --clean

  # goreleaser-cross cannot currently produce a runnable macOS binary: its
  # bundled linker emits a Mach-O image rejected by current macOS runners
  # (dyld: __DATA_CONST segment missing SG_READ_ONLY flag). Build each macOS
  # architecture on its native GitHub-hosted runner instead. The archive is
  # attached to the draft created above before any platform validation runs.
  macos-native:
    name: Build macOS ${{ matrix.arch }} artifact (native)
    needs: goreleaser
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, arch: amd64, machine: x86_64 }
          - { runner: macos-14, arch: arm64, machine: arm64 }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Assert native runner architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"
      - name: Build native macOS server archive
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ./scripts/release/build-server.sh
          archive="momentum-server-darwin-${GOARCH}.tar.gz"
          staging="$(mktemp -d)/momentum"
          mkdir -p "${staging}/scripts"
          cp dist/server/momentum-server "${staging}/"
          cp -R scripts/packaging "${staging}/scripts/"
          cp LICENSE docs/release-packaging.md "${staging}/"
          tar -czf "${archive}" -C "${staging}" .
          shasum -a 256 "${archive}" > "${archive}.sha256"
          mkdir -p macos-assets
          mv "${archive}" "${archive}.sha256" macos-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: macos-assets/
          if-no-files-found: error

  macos-attach:
    name: Attach native macOS artifacts
    needs: macos-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: macos-assets
          merge-multiple: true
      - name: Attach macOS archives and extend checksums
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          set -euo pipefail
          test -f macos-assets/momentum-server-darwin-amd64.tar.gz
          test -f macos-assets/momentum-server-darwin-arm64.tar.gz
          gh release upload "${GITHUB_REF_NAME}" \
            macos-assets/momentum-server-darwin-amd64.tar.gz \
            macos-assets/momentum-server-darwin-arm64.tar.gz \
            --repo "${GITHUB_REPOSITORY}" --clobber
          gh release download "${GITHUB_REF_NAME}" \
            --pattern checksums.txt --dir macos-assets \
            --repo "${GITHUB_REPOSITORY}"
          cat macos-assets/momentum-server-darwin-amd64.tar.gz.sha256 \
            macos-assets/momentum-server-darwin-arm64.tar.gz.sha256 \
            >> macos-assets/checksums.txt
          gh release upload "${GITHUB_REF_NAME}" macos-assets/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" --clobber

  smoke-test:
    name: Smoke test (${{ matrix.os }})
    needs: [goreleaser, macos-attach]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, artifact: momentum-server-linux-amd64.tar.gz }
          - { os: windows-latest, artifact: momentum-server-windows-amd64.zip }
          - { os: macos-15-intel, artifact: momentum-server-darwin-amd64.tar.gz }
          - { os: macos-14, artifact: momentum-server-darwin-arm64.tar.gz }
    steps:
      - uses: actions/checkout@v4
      - name: Download release artifact
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release download "${{ github.ref_name }}" --pattern "${{ matrix.artifact }}" --repo "${{ github.repository }}"
      - name: Extract archive
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            powershell -NoProfile -Command "Expand-Archive -Path '${{ matrix.artifact }}' -DestinationPath . -Force"
          else
            tar -xzf "${{ matrix.artifact }}"
          fi
      - name: Start discovered binary and verify health
        shell: bash
        env:
          # Smoke tests use the explicit local-development mode so the binary
          # can generate a certificate and encryption key in the ephemeral VM.
          MOMENTUM_DEV_MODE: '1'
        run: |
          set -euo pipefail
          BINARY="$(find . -type f \( -name momentum-server -o -name momentum-server.exe \) -print -quit)"
          [[ -n "$BINARY" ]] || { echo 'release binary not found'; exit 1; }
          BINARY="$(cd "$(dirname "$BINARY")" && pwd)/$(basename "$BINARY")"
          LOG_FILE="$RUNNER_TEMP/momentum-smoke.log"
          # Run outside the extracted archive. Web assets are embedded in the
          # binary and must not require a co-located web/ directory.
          (cd "$RUNNER_TEMP" && "$BINARY") >"$LOG_FILE" 2>&1 & SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat "$LOG_FILE"' EXIT
          for _ in $(seq 1 20); do
            if curl -k -fsS https://localhost:8443/health >/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'health endpoint did not become ready'; exit 1

  integration-test:
    name: Release workflow integration (${{ matrix.os }})
    needs: smoke-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, artifact: momentum-server-linux-amd64.tar.gz, binary: momentum-server }
          - { os: windows-latest, artifact: momentum-server-windows-amd64.zip, binary: momentum-server.exe }
          - { os: macos-15-intel, artifact: momentum-server-darwin-amd64.tar.gz, binary: momentum-server }
          - { os: macos-14, artifact: momentum-server-darwin-arm64.tar.gz, binary: momentum-server }
    steps:
      - uses: actions/checkout@v4
      - name: Download platform release artifact
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release download "${{ github.ref_name }}" --pattern "${{ matrix.artifact }}" --repo "${{ github.repository }}"
      - name: Extract Linux archive
        if: runner.os != 'Windows'
        run: tar -xzf "${{ matrix.artifact }}"
      - name: Extract Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "${{ matrix.artifact }}" -DestinationPath . -Force
      - run: chmod +x scripts/release/integration-test.sh
      - name: Run complete fresh-database workflow
        shell: bash
        run: scripts/release/integration-test.sh "$(find . -type f -name '${{ matrix.binary }}' -print -quit)"

  verify-arm64-artifact:
    name: Verify Linux ARM64 artifact
    needs: [goreleaser, macos-attach]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux ARM64 artifact
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release download "${{ github.ref_name }}" --pattern 'momentum-server-linux-arm64.tar.gz' --repo "${{ github.repository }}"
      - name: Validate archive contains the executable
        run: tar -tzf momentum-server-linux-arm64.tar.gz | grep -Eq '(^|/)momentum-server$'

  publish:
    name: Publish release
    needs: [integration-test, verify-arm64-artifact]
    runs-on: ubuntu-latest
    steps:
      - name: Publish only after all validation
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
