name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    env:
      LIQUIBASE_VERSION: 4.27.0

    steps:
    - uses: actions/checkout@v3

    - name: Install Liquibase
      run: |
        set -e
        curl -sSL https://github.com/liquibase/liquibase/releases/download/v${LIQUIBASE_VERSION}/liquibase-${LIQUIBASE_VERSION}.zip -o liquibase.zip
        unzip liquibase.zip -d liquibase
        echo "$PWD/liquibase" >> $GITHUB_PATH

    - name: Verify Liquibase Installation
      run: liquibase --version

    - name: Validate Liquibase Changesets
      run: |
        set -e
        cd liquibase
        # Use in-memory H2 database for validation (H2 is bundled with Liquibase)
        # This validates changelog structure, syntax, and semantic correctness
        liquibase \
          --changeLogFile=changelog.xml \
          --url="jdbc:h2:mem:validation" \
          --driver=org.h2.Driver \
          --username=sa \
          --password= \
          validate
