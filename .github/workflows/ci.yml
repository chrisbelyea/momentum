name: CI
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    env:
      LIQUIBASE_VERSION: 4.27.0
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: momentum
          POSTGRES_PASSWORD: momentum
          POSTGRES_DB: momentum
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java (for Liquibase)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Validate Liquibase changelogs
        if: ${{ hashFiles('liquibase/changelog/**') != '' }}
        env:
          LIQUIBASE_URL: jdbc:postgresql://localhost:5432/momentum
          LIQUIBASE_USERNAME: momentum
          LIQUIBASE_PASSWORD: momentum
          LIQUIBASE_DRIVER: org.postgresql.Driver
        run: |
          set -e
          curl -sSL https://github.com/liquibase/liquibase/releases/download/v${LIQUIBASE_VERSION}/liquibase-${LIQUIBASE_VERSION}.zip -o liquibase.zip
          unzip -q liquibase.zip -d $HOME/liquibase
          $HOME/liquibase/liquibase --version
          if [ -f liquibase/liquibase.properties ]; then props="--defaultsFile=liquibase/liquibase.properties"; else props=""; fi
          $HOME/liquibase/liquibase $props validate || (echo "Liquibase validate failed" && exit 1)
          $HOME/liquibase/liquibase $props update || (echo "Liquibase update failed" && exit 1)
      - name: Lint & Tests
        run: |
          echo "TODO: add project-specific lint/test commands"
