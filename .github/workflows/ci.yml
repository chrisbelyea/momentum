name: CI
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  liquibase-sqlite:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('liquibase/changelog/**') != '' }}
    
    permissions:
      contents: read
    
    env:
      LB_VERSION: 4.27.0
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java (for Liquibase)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      
      - name: Install Liquibase
        run: |
          set -e
          curl -sSL https://github.com/liquibase/liquibase/releases/download/v${LB_VERSION}/liquibase-${LB_VERSION}.zip -o liquibase.zip
          unzip -q liquibase.zip -d $HOME/liquibase
          $HOME/liquibase/liquibase --version
      
      - name: Validate Liquibase with SQLite
        run: |
          set -e
          $HOME/liquibase/liquibase \
            --defaultsFile=liquibase/liquibase.properties \
            validate
      
      - name: Update Liquibase with SQLite
        run: |
          set -e
          $HOME/liquibase/liquibase \
            --defaultsFile=liquibase/liquibase.properties \
            update
  
  liquibase-postgresql:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('liquibase/changelog/**') != '' }}
    
    permissions:
      contents: read
    
    env:
      LB_VERSION: 4.27.0
    
    services:
      postgres:
        image: postgres:16
        env:
          # Ephemeral credentials for CI testing only - never used in production
          POSTGRES_USER: momentum
          POSTGRES_PASSWORD: momentum
          POSTGRES_DB: momentum
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java (for Liquibase)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      
      - name: Install Liquibase
        run: |
          set -e
          curl -sSL https://github.com/liquibase/liquibase/releases/download/v${LB_VERSION}/liquibase-${LB_VERSION}.zip -o liquibase.zip
          unzip -q liquibase.zip -d $HOME/liquibase
          $HOME/liquibase/liquibase --version
      
      - name: Validate Liquibase with PostgreSQL
        run: |
          set -e
          $HOME/liquibase/liquibase \
            --defaultsFile=liquibase/liquibase.properties \
            --url=jdbc:postgresql://localhost:5432/momentum \
            --username=momentum \
            --password=momentum \
            --driver=org.postgresql.Driver \
            validate
      
      - name: Update Liquibase with PostgreSQL
        run: |
          set -e
          $HOME/liquibase/liquibase \
            --defaultsFile=liquibase/liquibase.properties \
            --url=jdbc:postgresql://localhost:5432/momentum \
            --username=momentum \
            --password=momentum \
            --driver=org.postgresql.Driver \
            update
  
  lint-and-test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Lint & Tests
        run: |
          echo "TODO: add project-specific lint/test commands"
