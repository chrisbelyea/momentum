name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    env:
      LIQUIBASE_VERSION: 4.27.0

    steps:
    - uses: actions/checkout@v3

    - name: Install Liquibase
      run: |
        set -e
        curl -sSL https://github.com/liquibase/liquibase/releases/download/v${LIQUIBASE_VERSION}/liquibase-${LIQUIBASE_VERSION}.zip -o liquibase.zip
        unzip liquibase.zip -d liquibase
        echo "$PWD/liquibase" >> $GITHUB_PATH

    - name: Verify Liquibase Installation
      run: liquibase --version
