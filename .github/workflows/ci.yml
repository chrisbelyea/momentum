name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Liquibase
      run: |
        curl -sSL https://github.com/liquibase/liquibase/releases/download/v4.27.0/liquibase-4.27.0.zip -o liquibase.zip
        unzip liquibase.zip -d liquibase
        echo "$PWD/liquibase" >> $GITHUB_PATH

    - name: Verify Liquibase Installation
      run: liquibase --version
