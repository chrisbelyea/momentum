name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schema-drift:
    name: Canonical schema drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify embedded schema is generated from canonical changelog
        run: scripts/db/generate-init-sql.sh --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o bin/momentum-server ./cmd/server

  packaging-linux-launcher:
    name: Linux packaged launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -trimpath -o bin/momentum-server ./cmd/server
      - name: Exercise first-run launcher
        run: scripts/packaging/linux/test-launcher.sh "$GITHUB_WORKSPACE/bin/momentum-server"

  packaging-windows-launcher:
    name: Windows packaged launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -trimpath -o bin/momentum-server.exe ./cmd/server
      - name: Exercise first-run launcher
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/packaging/windows/Test-Launcher.ps1 `
            -BinaryPath "$PWD/bin/momentum-server.exe"

  web-browser-e2e:
    name: Browser workflow (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: go mod download
      - name: Build release binary for browser workflow
        run: go build -trimpath -o bin/momentum-server ./cmd/server
      - name: Install pinned browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise authenticated board/list workflow
        env:
          MOMENTUM_E2E_BINARY: ${{ github.workspace }}/bin/momentum-server
        run: npm run test:e2e

  caldav-radicale-interop:
    name: CalDAV interoperability (Radicale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Radicale 3.1.8 is pinned for reproducibility and supports the
          # maintained Python 3.12 runtime used by this integration job.
          python-version: '3.12'
      - name: Install pinned standards-focused CalDAV server
        run: python -m pip install --disable-pip-version-check 'radicale==3.1.8'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Run authenticated VTODO lifecycle against Radicale
        run: scripts/caldav/radicale-interop.sh

  caldav-nextcloud-interop:
    name: CalDAV interoperability (Nextcloud Tasks)
    runs-on: ubuntu-latest
    services:
      nextcloud:
        # Keep the provider-compatible implementation pinned. The Tasks app
        # release used below supports Nextcloud 31 through 33.
        image: nextcloud:31.0.8-apache@sha256:92bc503ea0c19789f402b0469ecfb8df1ffea81e2bf90a45bba39063a626aa00
        env:
          SQLITE_DATABASE: nextcloud
          NEXTCLOUD_ADMIN_USER: alice
          NEXTCLOUD_ADMIN_PASSWORD: secret
          NEXTCLOUD_TRUSTED_DOMAINS: 127.0.0.1 localhost
        ports:
          - 8080:80
        options: >-
          --health-cmd "php -r 'exit((int)!@file_get_contents(\"http://localhost/status.php\"));'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Run authenticated VTODO lifecycle against Nextcloud Tasks
        env:
          NEXTCLOUD_BASE_URL: http://127.0.0.1:8080
          NEXTCLOUD_USER: alice
          NEXTCLOUD_PASSWORD: secret
        run: scripts/caldav/nextcloud-interop.sh

  windows-service:
    name: Windows service lifecycle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Windows release binary
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '1'
          go build -trimpath -o momentum-server.exe ./cmd/server
      - name: Register, health-check, and stop SCM service
        shell: pwsh
        env:
          MOMENTUM_CI_SERVICE: Momentum-CI-${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceName = $env:MOMENTUM_CI_SERVICE
          $expectedDataDir = Join-Path $env:ProgramData 'Momentum'
          $key = 'ci-only-' + [guid]::NewGuid().ToString('N')
          try {
            & .\scripts\packaging\windows\Install-Momentum.ps1 `
              -BinaryPath (Resolve-Path .\momentum-server.exe) `
              -RegisterService `
              -ServiceName $serviceName `
              -EncryptionKey $key

            $serviceEnvironment = (Get-ItemProperty -LiteralPath "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName").Environment
            if (-not ($serviceEnvironment -contains "DB_PATH=$(Join-Path $expectedDataDir 'momentum.db')")) {
              throw "Windows service did not use the default ProgramData database path: $expectedDataDir"
            }

            $ready = $false
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri 'https://localhost:8443/health' -SkipCertificateCheck -UseBasicParsing
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Momentum Windows service did not become healthy on https://localhost:8443/health' }

            & .\scripts\packaging\windows\Test-TaskWorkflow.ps1 -BaseUrl 'https://127.0.0.1:8443'
          } finally {
            if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
              Stop-Service -Name $serviceName -Force -ErrorAction SilentlyContinue
              & sc.exe delete $serviceName | Out-Null
            }
          }

  macos-native-release:
    name: Native macOS release workflow (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, arch: amd64, machine: x86_64 }
          - { runner: macos-14, arch: arm64, machine: arm64 }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Assert native runner architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"
      - name: Build native release binary
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
          VERSION: ci-${{ github.sha }}
        run: ./scripts/release/build-server.sh
      - name: Run complete fresh-database workflow
        run: |
          chmod +x scripts/release/integration-test.sh
          scripts/release/integration-test.sh "$(pwd)/dist/server/momentum-server"
