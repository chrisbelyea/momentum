name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      LIQUIBASE_VERSION: 4.27.0

    steps:
    - uses: actions/checkout@v3

    - name: Install Liquibase
      run: |
        set -e
        curl -sSL https://github.com/liquibase/liquibase/releases/download/v${LIQUIBASE_VERSION}/liquibase-${LIQUIBASE_VERSION}.zip -o liquibase.zip
        unzip liquibase.zip -d liquibase
        echo "$PWD/liquibase" >> $GITHUB_PATH

    - name: Verify Liquibase Installation
      run: liquibase --version

    - name: Validate Repository Structure
      run: |
        set -e
        echo "Validating required documentation files..."
        test -f README.md || (echo "ERROR: README.md is missing" && exit 1)
        test -f .github/CONTRIBUTING.md || (echo "ERROR: CONTRIBUTING.md is missing" && exit 1)
        test -f requirements/specification.md || (echo "ERROR: specification.md is missing" && exit 1)
        test -f requirements/vision.md || (echo "ERROR: vision.md is missing" && exit 1)
        test -f docs/design-overview.md || (echo "ERROR: design-overview.md is missing" && exit 1)
        echo "✓ All required documentation files present"

        echo "Validating directory structure..."
        test -d scripts/db || (echo "ERROR: scripts/db directory is missing" && exit 1)
        test -d .github/workflows || (echo "ERROR: .github/workflows directory is missing" && exit 1)
        echo "✓ Directory structure is valid"

        echo "CI validation complete!"
