name: CI
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  liquibase-sqlite:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('liquibase/changelog/**') != '' }}
    
    permissions:
      contents: read
    
    env:
      LB_VERSION: 4.27.0
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java (for Liquibase)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      
      - name: Install Liquibase
        run: |
          set -e
          curl -sSL https://github.com/liquibase/liquibase/releases/download/v${LB_VERSION}/liquibase-${LB_VERSION}.zip -o liquibase.zip
          unzip -q liquibase.zip -d $HOME/liquibase
          $HOME/liquibase/liquibase --version
      
      - name: Download SLF4J libraries for SQLite
        run: |
          set -e
          curl -sSL https://repo1.maven.org/maven2/org/slf4j/slf4j-api/2.0.9/slf4j-api-2.0.9.jar -o $HOME/liquibase/internal/lib/slf4j-api-2.0.9.jar
          curl -sSL https://repo1.maven.org/maven2/org/slf4j/slf4j-simple/2.0.9/slf4j-simple-2.0.9.jar -o $HOME/liquibase/internal/lib/slf4j-simple-2.0.9.jar
      
      - name: Validate Liquibase with SQLite
        run: |
          set -e
          $HOME/liquibase/liquibase \
            --defaultsFile=liquibase/liquibase.properties \
            validate
      
      - name: Update Liquibase with SQLite
        run: |
          set -e
          $HOME/liquibase/liquibase \
            --defaultsFile=liquibase/liquibase.properties \
            update
  
  liquibase-postgresql:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('liquibase/changelog/**') != '' }}
    
    permissions:
      contents: read

    env:
      LB_VERSION: 4.27.0
    
    services:
      postgres:
        image: postgres:16
        env:
          # Ephemeral credentials for CI testing only - never used in production
          POSTGRES_USER: momentum
          POSTGRES_PASSWORD: momentum
          POSTGRES_DB: momentum
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java (for Liquibase)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      
      - name: Install Liquibase
        run: |
          set -e
          curl -sSL https://github.com/liquibase/liquibase/releases/download/v${LB_VERSION}/liquibase-${LB_VERSION}.zip -o liquibase.zip
          unzip -q liquibase.zip -d $HOME/liquibase
          $HOME/liquibase/liquibase --version
      
      - name: Validate Liquibase with PostgreSQL
        run: |
          set -e
          $HOME/liquibase/liquibase \
            --defaultsFile=liquibase/liquibase.properties \
            --url=jdbc:postgresql://localhost:5432/momentum \
            --username=momentum \
            --password=momentum \
            --driver=org.postgresql.Driver \
            validate
      
      - name: Update Liquibase with PostgreSQL
        run: |
          set -e
          $HOME/liquibase/liquibase \
            --defaultsFile=liquibase/liquibase.properties \
            --url=jdbc:postgresql://localhost:5432/momentum \
            --username=momentum \
            --password=momentum \
            --driver=org.postgresql.Driver \
            update
  
  lint-and-test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v3

    - name: Install Liquibase
      run: |
        set -e
        curl -sSL https://github.com/liquibase/liquibase/releases/download/v${LIQUIBASE_VERSION}/liquibase-${LIQUIBASE_VERSION}.zip -o liquibase.zip
        unzip liquibase.zip -d liquibase-install
        echo "$PWD/liquibase-install" >> $GITHUB_PATH

    - name: Verify Liquibase Installation
      run: liquibase --version

    - name: Validate Liquibase Changesets
      run: |
        set -e
        cd liquibase
        # Use in-memory H2 database for validation (H2 is bundled with Liquibase)
        # This validates changelog structure, syntax, and semantic correctness
        liquibase \
          --changeLogFile=changelog.xml \
          --url="jdbc:h2:mem:validation" \
          --driver=org.h2.Driver \
          --username=sa \
          --password= \
          validate
          
    - name: Validate Repository Structure
      run: |
        set -e
        echo "Validating required documentation files..."
        test -f README.md || (echo "ERROR: README.md is missing" && exit 1)
        test -f .github/CONTRIBUTING.md || (echo "ERROR: CONTRIBUTING.md is missing" && exit 1)
        test -f requirements/specification.md || (echo "ERROR: specification.md is missing" && exit 1)
        test -f requirements/vision.md || (echo "ERROR: vision.md is missing" && exit 1)
        test -f docs/design-overview.md || (echo "ERROR: design-overview.md is missing" && exit 1)
        echo "✓ All required documentation files present"

        echo "Validating directory structure..."
        test -d scripts/db || (echo "ERROR: scripts/db directory is missing" && exit 1)
        test -d .github/workflows || (echo "ERROR: .github/workflows directory is missing" && exit 1)
        echo "✓ Directory structure is valid"

        echo "CI validation complete!"
